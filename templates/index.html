<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EditVerse</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-soft: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --border: rgba(148, 163, 184, 0.25);
      --free: #10b981;
      --paid: #f59e0b;
      --shadow: 0 18px 40px rgba(15, 23, 42, 0.45);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #020817 0%, #0b1120 100%);
      color: var(--text);
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }
    .brand {
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.05em;
    }
    .brand .accent { color: #7dd3fc; }
    .search-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      max-width: 500px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
    }
    .search-wrap input {
      appearance: none;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      width: 100%;
      font-size: 1rem;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 22px 0 18px;
    }
    .filter-btn {
      background: #111827;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: 0.2s ease;
      font-weight: 600;
    }
    .filter-btn.active {
      background: linear-gradient(135deg, #0ea5e9, #8b5cf6);
      border-color: transparent;
      box-shadow: var(--shadow);
    }
    .section { margin-top: 24px; }
    .section h2 { margin: 0 0 14px; font-size: 1.25rem; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 18px;
    }
    .card {
      position: relative;
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px 16px 16px;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, border-color 0.2s ease;
      overflow: hidden;
    }
    .card:hover { transform: translateY(-2px); border-color: rgba(125, 211, 252, 0.7); }
    .card::before {
      content: "";
      position: absolute;
      inset: 0 auto auto 0;
      width: 100%;
      height: 4px;
      background: var(--card-color, #60a5fa);
    }
    .top-row { display: flex; justify-content: space-between; align-items: start; gap: 10px; margin-bottom: 14px; }
    .icon {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.06);
      border-radius: 12px;
      font-size: 1.3rem;
      font-weight: 700;
    }
    .badge {
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border: 1px solid transparent;
    }
    .badge.free { background: rgba(16, 185, 129, 0.12); color: #6ee7b7; border-color: rgba(16, 185, 129, 0.4); }
    .badge.paid { background: rgba(245, 158, 11, 0.12); color: #fbbf24; border-color: rgba(245, 158, 11, 0.35); }
    h3 { margin: 0 0 8px; font-size: 1.15rem; }
    .meta { color: var(--muted); font-size: 0.78rem; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
    p { margin: 0 0 16px; line-height: 1.5; color: #d1d5db; font-size: 0.95rem; }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .tag { background: rgba(148, 163, 184, 0.12); color: #dbeafe; border: 1px solid rgba(148, 163, 184, 0.2); padding: 6px 8px; border-radius: 999px; font-size: 0.7rem; }
    .link { display: inline-block; text-decoration: none; color: #dbeafe; background: rgba(59,130,246,0.16); padding: 9px 12px; border-radius: 10px; border: 1px solid rgba(59,130,246,0.33); font-weight: 600; }
    .hidden { display: none !important; }
    @media (max-width: 700px) {
      .brand { width: 100%; }
      header { align-items: stretch; }
      .search-wrap { max-width: none; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand"><span class="accent">Edit</span>Verse</div>
      <div class="search-wrap">
        <span>🔎</span>
        <input id="search" type="text" placeholder="Search tools, categories, or tags..." />
      </div>
    </header>
    <div id="filters" class="filters"></div>
    <div class="section"><h2>Free &amp; Open Tools</h2><div id="free-cards" class="cards"></div></div>
    <div class="section"><h2>Paid / Premium Tools</h2><div id="paid-cards" class="cards"></div></div>
  </div>
  <script>
    const tools = {{ tools|tojson }};
    const categories = {{ categories|tojson }};
    const filtersEl = document.getElementById('filters');
    const freeCardsEl = document.getElementById('free-cards');
    const paidCardsEl = document.getElementById('paid-cards');
    const searchInput = document.getElementById('search');
    let currentCategory = 'All';
    const colors = { violet: '#8b5cf6', purple: '#a855f7', slate: '#64748b', dark: '#94a3b8', pink: '#ec4899', cyan: '#06b6d4', blue: '#3b82f6', green: '#10b981', orange: '#f97316' };

    function createCard(tool) {
      const card = document.createElement('div');
      card.className = 'card';
      card.style.setProperty('--card-color', colors[tool.color] || '#60a5fa');
      const tags = (tool.tags || []).map(tag => `<span class="tag">${tag}</span>`).join('');
      card.innerHTML = `
        <div class="top-row"><div class="icon">${tool.icon || '✦'}</div><span class="badge ${tool.pricing}">${tool.pricing}</span></div>
        <div class="meta">${tool.category}</div><h3>${tool.name}</h3>
        <div class="meta">${tool.type}</div><p>${tool.description}</p>
        <div class="tags">${tags}</div>
        <a class="link" href="${tool.url}" target="_blank" rel="noopener noreferrer">Visit site</a>`;
      return card;
    }

    function renderFilters() {
      filtersEl.innerHTML = '';
      categories.forEach(category => {
        const button = document.createElement('button');
        button.className = `filter-btn ${category === currentCategory ? 'active' : ''}`;
        button.textContent = category;
        button.addEventListener('click', () => { currentCategory = category; renderFilters(); renderCards(); });
        filtersEl.appendChild(button);
      });
    }

    function renderCards() {
      const query = searchInput.value.trim().toLowerCase();
      const filtered = tools.filter(tool => {
        const matchesCategory = currentCategory === 'All' || tool.category === currentCategory;
        const searchable = [tool.name, tool.category, tool.type, (tool.tags || []).join(' '), tool.description].join(' ').toLowerCase();
        return matchesCategory && (!query || searchable.includes(query));
      });
      freeCardsEl.replaceChildren(...filtered.filter(tool => tool.pricing === 'free').map(createCard));
      paidCardsEl.replaceChildren(...filtered.filter(tool => tool.pricing === 'paid').map(createCard));
    }

    renderFilters();
    renderCards();
    searchInput.addEventListener('input', renderCards);
  </script>
</body>
</html>
